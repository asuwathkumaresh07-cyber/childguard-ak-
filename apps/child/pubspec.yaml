name: child
description: Family Guard Child — protection VPN, block list, activity logging.
publish_to: none
version: 1.0.9+10

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_animate: ^4.5.2
  not_static_icons: ^0.54.0
  cupertino_icons: ^1.0.8
  shared:
    path: ../../packages/shared
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  geolocator: ^14.1.1
  image_picker: ^1.2.4
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/pets/openpets/hoodie.webp
    - assets/pets/openpets/pajamas.webp
    - assets/pets/openpets/summer.webp
    - assets/pets/openpets/LICENSE.txt
    - assets/pets/openpets/source.json
    - assets/pets/friends/
