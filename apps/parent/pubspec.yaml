publish_to: none
version: 1.0.9+10

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared:
    path: ../../packages/shared
  intl: ^0.20.2
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  url_launcher: ^6.3.3
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
